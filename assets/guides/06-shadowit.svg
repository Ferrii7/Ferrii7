<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="600" height="210" role="img" aria-label="Shadow IT and Remote Work Risks">
<style>
.card{animation:rise .7s ease-out both}
.bar{animation:grow 1.2s .4s ease-out both;transform-box:fill-box;transform-origin:left}
.sheen{animation:sheen 7s ease-in-out infinite}
.shackle{animation:shackle 3.2s ease-in-out infinite}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp 3.6s ease-out infinite}
.scan{animation:scan 2.6s ease-in-out infinite}
.ghost{animation:glitch 2.6s steps(1) infinite}
.ring{animation:ring 6s linear infinite}
.hand{animation:spin 6s linear infinite}
.bait{animation:bob 2.8s ease-in-out infinite}
.wave{animation:wave 2.4s ease-in-out infinite}
.w2{animation-delay:.25s}.w3{animation-delay:.5s}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheen{0%,70%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
@keyframes shackle{0%,35%,100%{transform:translateY(0)}50%,80%{transform:translateY(-12px)}}
@keyframes stamp{0%,10%{opacity:0;transform:scale(1.8)}22%{opacity:1;transform:scale(.94)}28%,80%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(1)}}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(96px)}100%{transform:translateY(0)}}
@keyframes glitch{0%,100%{transform:translate(0,0)}40%{transform:translate(5px,-2px)}44%{transform:translate(-4px,1px)}48%{transform:translate(0,0)}}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(6px)}}
@keyframes wave{0%,100%{opacity:.15}40%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2440"/><stop offset="1" stop-color="#06101e"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="fr"><rect width="600" height="210" rx="14"/></clipPath>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1d3658"/></pattern>
</defs>
<g class="card" style="animation-delay:0.75s">
<g clip-path="url(#fr)">
 <rect width="600" height="210" fill="url(#bg)"/>
 <rect x="400" width="200" height="210" fill="url(#dots)"/>
 <circle cx="500" cy="105" r="80" fill="#7fb3e8" fill-opacity=".06"/>
 <g class="sheen" style="animation-delay:5.5s"><rect x="0" y="-60" width="160" height="330" fill="url(#sh)" transform="skewX(-20)"/></g>
 <rect class="bar" style="animation-delay:1.15s" x="0" y="205" width="600" height="5" fill="#f2b632"/>
</g>
<rect x=".75" y=".75" width="598.5" height="208.5" rx="13.5" fill="none" stroke="#22406a" stroke-width="1.5"/>
<text x="36" y="48" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.5" fill="#f2b632">GUIDE · REMOTE WORK</text>
<text x="36" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#f4efe4">Shadow IT &amp; Remote</text><text x="36" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#f4efe4">Work Risks</text>
<text x="36" y="180" font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#7fb3e8">Read the guide →</text>

<g transform="translate(500 115)">
 <path class="wave w3" d="M-42 -40 A60 60 0 0 1 42 -40" fill="none" stroke="#f2b632" stroke-width="4" stroke-linecap="round"/>
 <path class="wave w2" d="M-28 -28 A40 40 0 0 1 28 -28" fill="none" stroke="#f2b632" stroke-width="4" stroke-linecap="round"/>
 <path class="wave w1" d="M-14 -16 A20 20 0 0 1 14 -16" fill="none" stroke="#f2b632" stroke-width="4" stroke-linecap="round"/>
 <rect x="-40" y="-4" width="80" height="50" rx="5" fill="#0f2440" stroke="#7fb3e8" stroke-width="3"/>
 <path d="M-54 50 H54 L48 58 H-48 Z" fill="#7fb3e8"/>
 <text class="blink" x="0" y="28" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#e5484d">?</text>
</g>
</g>
</svg>