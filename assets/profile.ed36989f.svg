<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 398" width="900" height="398" role="img" aria-label="Profile: Ferran Fabra's role, audience, what has shipped, stack, education and languages">
<style>@font-face{font-family:sbh-cap;font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
.f-cap{font-family:sbh-cap,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}
@font-face{font-family:sbh-sans;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
.f-sans{font-family:sbh-sans,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}
.tw{animation:tw 6s ease-in-out infinite}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:100;animation:draw 1.8s ease-out both}
.pk{stroke-dasharray:6 200;animation:pk 3.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pk{from{stroke-dashoffset:6}to{stroke-dashoffset:-100}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}75%,100%{transform:scale(3.4);opacity:0}}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(-14px,6px) rotate(24deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style>
<defs></defs>
<rect x=".5" y=".5" width="899" height="397" rx="6" fill="#0A0E12" stroke="rgba(242,240,235,0.12)"/>
<rect x="40" y="27" width="3" height="14" fill="#C98F2C"/>
<text class="f-cap" x="54" y="39" font-size="12" letter-spacing="1.4" fill="rgba(242,240,235,0.92)">FERRAN FABRA</text>
<text class="f-cap" x="860" y="39" font-size="11" text-anchor="end" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">CATALONIA, ES</text>
<line x1="40" y1="64" x2="860" y2="64" stroke="rgba(242,240,235,0.14)"/><text class="f-cap" x="40" y="92" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">ROLE</text><text class="f-sans" x="200" y="93" font-size="16" fill="rgba(242,240,235,0.9)">Founder and developer, SecureBusinessHub</text>
<line x1="40" y1="110" x2="860" y2="110" stroke="rgba(242,240,235,0.07)"/><text class="f-cap" x="40" y="138" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">AUDIENCE</text><text class="f-sans" x="200" y="139" font-size="16" fill="rgba(242,240,235,0.9)">Small and medium businesses without a dedicated security team</text>
<line x1="40" y1="156" x2="860" y2="156" stroke="rgba(242,240,235,0.07)"/><text class="f-cap" x="40" y="184" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">SHIPPED</text><text class="f-sans" x="200" y="185" font-size="16" fill="rgba(242,240,235,0.9)">6 free security tools, a 228-term glossary, the Starter Kit</text>
<line x1="40" y1="202" x2="860" y2="202" stroke="rgba(242,240,235,0.07)"/><text class="f-cap" x="40" y="230" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">STACK</text><text class="f-sans" x="200" y="231" font-size="16" fill="rgba(242,240,235,0.9)">React, TypeScript, Cloudflare Workers, D1, R2</text>
<line x1="40" y1="248" x2="860" y2="248" stroke="rgba(242,240,235,0.07)"/><text class="f-cap" x="40" y="276" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">EDUCATION</text><text class="f-sans" x="200" y="277" font-size="16" fill="rgba(242,240,235,0.9)">ASIR, cybersecurity track: Cisco, Linux, Windows Server</text>
<line x1="40" y1="294" x2="860" y2="294" stroke="rgba(242,240,235,0.07)"/><text class="f-cap" x="40" y="322" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">FOCUS NEXT</text><text class="f-sans" x="200" y="323" font-size="16" fill="rgba(242,240,235,0.9)">Offensive security</text>
<line x1="40" y1="340" x2="860" y2="340" stroke="rgba(242,240,235,0.07)"/><text class="f-cap" x="40" y="368" font-size="11" letter-spacing="1.3" fill="rgba(242,240,235,0.45)">LANGUAGES</text><text class="f-sans" x="200" y="369" font-size="16" fill="rgba(242,240,235,0.9)">Català, Español, English</text>
</svg>
