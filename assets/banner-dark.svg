<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" width="1280" height="410" role="img" aria-label="Ferran Fabra, founder of SecureBusinessHub">
<style>
.arc{stroke-dasharray:220;animation:draw 1.4s ease-out both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.5s ease-out infinite;opacity:0}
.fade{animation:fade .9s ease-out both}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}70%{transform:scale(3.2);opacity:0}100%{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.arc,.fade{animation:none;stroke-dashoffset:0;opacity:1}.pulse,.cursor{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1628"/><stop offset="1" stop-color="#06101e"/></linearGradient>
<radialGradient id="glow" cx="1035" cy="205" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7fb3e8" stop-opacity=".18"/><stop offset="1" stop-color="#7fb3e8" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1d3658"/></pattern>
<clipPath id="frame"><rect width="1280" height="410" rx="18"/></clipPath><clipPath id="g"><circle cx="1035" cy="205" r="150"/></clipPath>
</defs>
<rect width="1280" height="410" rx="18" fill="url(#bg)"/>
